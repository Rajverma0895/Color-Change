<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Color Studio</title>
    <style>
        :root {
            --surface: rgba(15, 23, 42, 0.62);
            --surface-border: rgba(148, 163, 184, 0.25);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent: linear-gradient(135deg, #22d3ee, #6366f1);
            --accent-hover: linear-gradient(135deg, #06b6d4, #4f46e5);
            --danger: linear-gradient(135deg, #fb7185, #f43f5e);
            --success: linear-gradient(135deg, #34d399, #10b981);
            --shadow: 0 24px 50px rgba(15, 23, 42, 0.35);
            --card-shadow: 0 10px 24px rgba(15, 23, 42, 0.25);
            --animation-speed: 0.35s;
            --background-start: #0f172a;
            --background-end: #312e81;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 16px;
            color: var(--text-primary);
            background: radial-gradient(circle at 20% 20%, #1e1b4b, transparent 40%),
                        radial-gradient(circle at 80% 0%, #0c4a6e, transparent 35%),
                        linear-gradient(145deg, var(--background-start), var(--background-end));
            transition: background var(--animation-speed) ease;
        }

        .app-container {
            width: min(960px, 100%);
            display: grid;
            gap: 20px;
        }

        .hero {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 26px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .hero p {
            margin: 8px 0 0;
            color: var(--text-secondary);
        }

        .controls-panel {
            display: grid;
            gap: 16px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .control-group {
            background: rgba(30, 41, 59, 0.65);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--card-shadow);
        }

        h2 {
            margin: 0 0 12px;
            font-size: 1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 999px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            background: var(--accent);
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            background: var(--accent-hover);
        }

        button:active {
            transform: translateY(0);
        }

        button.danger {
            background: var(--danger);
        }

        button.success {
            background: var(--success);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .status-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 14px;
            padding: 12px 14px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        #message {
            min-height: 1.3rem;
            color: #93c5fd;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #message.visible {
            opacity: 1;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            width: 100%;
            justify-content: center;
            padding: 8px;
        }

        .box {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: linear-gradient(135deg, #94a3b8, #64748b);
            box-shadow: var(--card-shadow);
            cursor: pointer;
            opacity: 0;
            transform: scale(0.5);
            transition: background-color 0.3s ease,
                        transform var(--animation-speed) cubic-bezier(0.22, 1, 0.36, 1),
                        opacity var(--animation-speed) ease;
        }

        .box.visible {
            opacity: 1;
            transform: scale(1);
        }

        .box.exiting {
            opacity: 0;
            transform: scale(0.45) rotate(16deg);
        }

        .box:hover {
            transform: translateY(-4px) scale(1.08) rotate(2deg);
        }

        @media (max-width: 640px) {
            body {
                padding: 20px 12px;
            }

            .hero,
            .controls-panel {
                padding: 18px;
                border-radius: 18px;
            }

            .box {
                width: 56px;
                height: 56px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <section class="hero">
            <h1>✨ Color Studio Playground</h1>
            <p>Style the background, create colorful tiles, and tap boxes to remix shades instantly.</p>
        </section>

        <section class="controls-panel">
            <div class="control-group">
                <h2>Background</h2>
                <div class="button-row">
                    <button onclick="changeBackgroundColor()">Change Background</button>
                    <button class="success" onclick="resetBackgroundColor()">Reset Background</button>
                </div>
            </div>

            <div class="control-group">
                <h2>Boxes</h2>
                <div class="button-row">
                    <button onclick="addBoxes()">Add Box</button>
                    <button onclick="removeBoxes()">Remove Box</button>
                    <button class="danger" onclick="removeAllBoxes()">Remove All</button>
                    <button class="success" onclick="toggleBoxColors()">Toggle Colors</button>
                </div>
            </div>

            <div class="status-grid">
                <div id="colorDisplay" class="status-card">Current Color: Default Gradient</div>
                <div id="boxCountDisplay" class="status-card">Total Boxes: 0</div>
            </div>
            <div id="message">Click 'Add Box' to start!</div>
        </section>

        <div class="container" id="boxContainer"></div>
    </div>

    <script>
        const body = document.body;
        const colorDisplay = document.getElementById('colorDisplay');
        const message = document.getElementById('message');
        const boxContainer = document.getElementById('boxContainer');
        const boxCountDisplay = document.getElementById('boxCountDisplay');

        const defaultBgGradient = `radial-gradient(circle at 20% 20%, #1e1b4b, transparent 40%), radial-gradient(circle at 80% 0%, #0c4a6e, transparent 35%), linear-gradient(145deg, var(--background-start), var(--background-end))`;
        const animationSpeedMs = 350;

        let boxCount = 0;
        const maxBoxes = 50;
        let boxColorsToggled = false;

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function showMessage(text) {
            message.textContent = text;
            message.classList.add('visible');
        }

        function changeBackgroundColor() {
            const newColor = getRandomColor();
            body.style.background = newColor;
            colorDisplay.textContent = `Current Color: ${newColor}`;
            showMessage('Background color changed!');
        }

        function resetBackgroundColor() {
            body.style.background = defaultBgGradient;
            colorDisplay.textContent = 'Current Color: Default Gradient';
            showMessage('Background reset to default.');
        }

        function addBoxes() {
            if (boxCount >= maxBoxes) {
                showMessage('Maximum number of boxes reached!');
                return;
            }

            const newBox = document.createElement('div');
            newBox.classList.add('box');
            newBox.style.backgroundColor = boxColorsToggled ? '#7dd3fc' : getRandomColor();
            newBox.addEventListener('click', handleBoxClick);

            boxContainer.appendChild(newBox);
            setTimeout(() => {
                newBox.classList.add('visible');
            }, 10);

            boxCount++;
            updateBoxCountDisplay();
            showMessage(`Added a box. Total: ${boxCount}`);
        }

        function removeBoxes() {
            if (boxCount === 0) {
                showMessage('No boxes to remove!');
                return;
            }

            const lastBox = boxContainer.lastChild;
            if (lastBox) {
                lastBox.classList.add('exiting');
                lastBox.removeEventListener('click', handleBoxClick);

                lastBox.addEventListener('transitionend', () => {
                    if (lastBox.parentNode === boxContainer) {
                        boxContainer.removeChild(lastBox);
                    }
                }, { once: true });

                setTimeout(() => {
                    if (lastBox.parentNode === boxContainer) {
                        boxContainer.removeChild(lastBox);
                    }
                }, animationSpeedMs + 50);
            }

            boxCount--;
            updateBoxCountDisplay();
            showMessage(`Removed a box. Total: ${boxCount}`);
        }

        function removeAllBoxes() {
            if (boxCount === 0) {
                showMessage('No boxes to remove!');
                return;
            }

            while (boxContainer.firstChild) {
                boxContainer.firstChild.removeEventListener('click', handleBoxClick);
                boxContainer.removeChild(boxContainer.firstChild);
            }
            boxCount = 0;
            updateBoxCountDisplay();
            showMessage('All boxes removed!');
        }

        function toggleBoxColors() {
            if (boxCount === 0) {
                showMessage('Add some boxes first!');
                return;
            }

            const boxes = boxContainer.querySelectorAll('.box');
            boxColorsToggled = !boxColorsToggled;

            boxes.forEach(box => {
                box.style.backgroundColor = boxColorsToggled ? '#7dd3fc' : getRandomColor();
            });

            showMessage(boxColorsToggled ? 'Boxes set to sky blue!' : 'Boxes set to random colors!');
        }

        function handleBoxClick(event) {
            const clickedBox = event.target;
            const newColor = getRandomColor();
            clickedBox.style.backgroundColor = newColor;
            console.log('Box color changed to:', newColor);
        }

        function updateBoxCountDisplay() {
            boxCountDisplay.textContent = `Total Boxes: ${boxCount}`;
        }

        function initialize() {
            colorDisplay.textContent = 'Current Color: Default Gradient';
            showMessage("Click 'Add Box' to start!");
            updateBoxCountDisplay();
        }

        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
