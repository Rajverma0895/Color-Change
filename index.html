<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Studio</title>
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1d4ed8;
            --bg-3: #22d3ee;
            --surface: rgba(255, 255, 255, 0.12);
            --surface-strong: rgba(255, 255, 255, 0.2);
            --border: rgba(255, 255, 255, 0.25);
            --text: #f8fafc;
            --muted: #cbd5e1;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --success: #22c55e;
            --shadow: 0 15px 45px rgba(15, 23, 42, 0.35);
            --speed: 0.35s;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(130deg, var(--bg-1), var(--bg-2), var(--bg-3));
            background-size: 200% 200%;
            animation: moveBg 12s ease infinite;
            padding: 2rem 1rem;
        }

        @keyframes moveBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app {
            width: min(980px, 100%);
            margin: 0 auto;
            display: grid;
            gap: 1.25rem;
        }

        .hero {
            text-align: center;
            padding: 1rem;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(1.7rem, 2.8vw, 2.5rem);
            letter-spacing: -0.03em;
        }

        .hero p {
            margin: 0.5rem auto 0;
            max-width: 600px;
            color: var(--muted);
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 1.25rem;
        }

        .controls {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }

        .section h2 {
            margin: 0 0 0.75rem;
            font-size: 1rem;
            color: #e2e8f0;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 0.62rem 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(90deg, var(--primary), #8b5cf6);
            cursor: pointer;
            transition: transform var(--speed), opacity var(--speed), box-shadow var(--speed), filter var(--speed);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-danger {
            background: linear-gradient(90deg, #f97316, var(--danger));
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.34);
        }

        .btn-success {
            background: linear-gradient(90deg, #10b981, var(--success));
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.34);
        }

        .status-grid {
            display: grid;
            gap: 0.75rem;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            margin-top: 1rem;
        }

        .pill {
            border: 1px solid var(--border);
            background: var(--surface-strong);
            border-radius: 14px;
            padding: 0.75rem 0.95rem;
            font-size: 0.95rem;
        }

        #message {
            min-height: 1.4em;
            color: #bfdbfe;
            opacity: 0;
            transition: opacity var(--speed);
        }

        #message.visible {
            opacity: 1;
        }

        #boxContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 0.8rem;
            align-items: start;
        }

        .box {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: #d1d5db;
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.3);
            cursor: pointer;
            opacity: 0;
            transform: scale(0.65);
            transition: transform var(--speed) cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity var(--speed), background-color 0.25s;
        }

        .box.visible {
            opacity: 1;
            transform: scale(1);
        }

        .box.exiting {
            opacity: 0;
            transform: scale(0.5) rotate(14deg);
        }

        .box:hover {
            transform: scale(1.08) rotate(2deg);
        }

        @media (max-width: 640px) {
            body { padding: 1rem 0.8rem; }
            .panel { padding: 1rem; }
            button { width: 100%; }
            .button-row { display: grid; grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="app">
        <section class="hero">
            <h1>🎨 Color Studio</h1>
            <p>Play with a modern gradient backdrop and interactive color boxes.</p>
        </section>

        <section class="panel">
            <div class="controls">
                <div class="section">
                    <h2>Background</h2>
                    <div class="button-row">
                        <button onclick="changeBackgroundColor()">Change Background</button>
                        <button class="btn-success" onclick="resetBackgroundColor()">Reset Background</button>
                    </div>
                </div>

                <div class="section">
                    <h2>Boxes</h2>
                    <div class="button-row">
                        <button onclick="addBoxes()">Add Box</button>
                        <button onclick="removeBoxes()">Remove Box</button>
                        <button class="btn-danger" onclick="removeAllBoxes()">Remove All</button>
                        <button class="btn-success" onclick="toggleBoxColors()">Toggle Colors</button>
                    </div>
                </div>
            </div>

            <div class="status-grid">
                <div class="pill" id="colorDisplay">Current Background: Default Gradient</div>
                <div class="pill" id="boxCountDisplay">Total Boxes: 0</div>
                <div class="pill" id="message">Click "Add Box" to start.</div>
            </div>
        </section>

        <section class="panel">
            <div id="boxContainer"></div>
        </section>
    </main>

    <script>
        const body = document.body;
        const colorDisplay = document.getElementById('colorDisplay');
        const message = document.getElementById('message');
        const boxContainer = document.getElementById('boxContainer');
        const boxCountDisplay = document.getElementById('boxCountDisplay');

        const defaultBgGradient = 'linear-gradient(130deg, var(--bg-1), var(--bg-2), var(--bg-3))';
        const animationSpeedMs = 350;

        let boxCount = 0;
        const maxBoxes = 50;
        let boxColorsToggled = false;

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function showMessage(text) {
            message.textContent = text;
            message.classList.add('visible');
        }

        function changeBackgroundColor() {
            const newColor = getRandomColor();
            body.style.background = newColor;
            body.style.animation = 'none';
            colorDisplay.textContent = `Current Background: ${newColor}`;
            showMessage('Background color changed.');
        }

        function resetBackgroundColor() {
            body.style.background = defaultBgGradient;
            body.style.animation = 'moveBg 12s ease infinite';
            colorDisplay.textContent = 'Current Background: Default Gradient';
            showMessage('Background reset to gradient.');
        }

        function addBoxes() {
            if (boxCount >= maxBoxes) {
                showMessage('Maximum number of boxes reached.');
                return;
            }

            const newBox = document.createElement('div');
            newBox.classList.add('box');
            newBox.style.backgroundColor = boxColorsToggled ? '#7dd3fc' : getRandomColor();
            newBox.addEventListener('click', handleBoxClick);
            boxContainer.appendChild(newBox);

            setTimeout(() => {
                newBox.classList.add('visible');
            }, 10);

            boxCount++;
            updateBoxCountDisplay();
            showMessage(`Added a box. Total: ${boxCount}`);
        }

        function removeBoxes() {
            if (boxCount === 0) {
                showMessage('No boxes to remove.');
                return;
            }

            const lastBox = boxContainer.lastChild;
            if (lastBox) {
                lastBox.classList.add('exiting');
                lastBox.removeEventListener('click', handleBoxClick);

                lastBox.addEventListener('transitionend', () => {
                    if (lastBox.parentNode === boxContainer) {
                        boxContainer.removeChild(lastBox);
                    }
                }, { once: true });

                setTimeout(() => {
                    if (lastBox.parentNode === boxContainer) {
                        boxContainer.removeChild(lastBox);
                    }
                }, animationSpeedMs + 50);
            }

            boxCount--;
            updateBoxCountDisplay();
            showMessage(`Removed a box. Total: ${boxCount}`);
        }

        function removeAllBoxes() {
            if (boxCount === 0) {
                showMessage('No boxes to remove.');
                return;
            }

            while (boxContainer.firstChild) {
                boxContainer.firstChild.removeEventListener('click', handleBoxClick);
                boxContainer.removeChild(boxContainer.firstChild);
            }

            boxCount = 0;
            updateBoxCountDisplay();
            showMessage('All boxes removed.');
        }

        function toggleBoxColors() {
            if (boxCount === 0) {
                showMessage('Add some boxes first.');
                return;
            }

            const boxes = boxContainer.querySelectorAll('.box');
            boxColorsToggled = !boxColorsToggled;
            boxes.forEach((box) => {
                box.style.backgroundColor = boxColorsToggled ? '#7dd3fc' : getRandomColor();
            });

            showMessage(boxColorsToggled ? 'Boxes set to sky blue.' : 'Boxes set to random colors.');
        }

        function handleBoxClick(event) {
            event.target.style.backgroundColor = getRandomColor();
        }

        function updateBoxCountDisplay() {
            boxCountDisplay.textContent = `Total Boxes: ${boxCount}`;
        }

        function initialize() {
            colorDisplay.textContent = 'Current Background: Default Gradient';
            updateBoxCountDisplay();
            showMessage('Click "Add Box" to start.');
        }

        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
